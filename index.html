<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free Web Apps</title></head><body><h1>Free Web Apps</h1><p>Small, free, private tools. Each lives in its own folder.</p><ul id="apps"></ul><script>fetch("apps.json").then(r=>r.json()).then(a=>apps.innerHTML=a.map(x=>`<li><a href="${x.slug}/">${x.name}</a> - ${x.description}</li>`).join(""))</script></body></html>
