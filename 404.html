<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>App not found</title>
<link rel="icon" href="https://umar8092.github.io/apps/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#f6f7fb;--card:#fff;--fg:#14172b;--mut:#5d6486;--acc:#4f5bd5;--bd:#e3e6f2}
@media (prefers-color-scheme:dark){:root{--bg:#0d1122;--card:#171d3a;--fg:#eef1ff;--mut:#9aa5d6;--acc:#8fa2ff;--bd:#2a3366}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{width:min(440px,100%);text-align:center;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:36px 24px}
.code{font-size:3.5rem;font-weight:800;color:var(--acc);line-height:1}
h1{margin:.4em 0 .3em;font-size:1.5rem}
p{margin:0 0 1.5em;color:var(--mut)}
a{display:inline-block;min-height:48px;padding:.8rem 1.6rem;border-radius:12px;background:var(--acc);color:#fff;font-weight:700;text-decoration:none}
@media (prefers-color-scheme:dark){a{color:#0d1122}}
a:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.dots{display:inline-flex;gap:.45em;margin:.2rem 0 .4rem}.dots i{display:block;width:10px;height:10px;border-radius:50%;background:#f97316}.dots i:nth-child(2){background:#d946ef}.dots i:nth-child(3){background:#6366f1}.dots i:nth-child(4){background:#0ea5e9}.dots i:nth-child(5){background:#10b981}
</style>
</head>
<body>
<main>
<div class="code" aria-hidden="true">404</div>
<div class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
<h1>This app does not exist or has been moved</h1>
<p>The page you tried to open is not here. Pick an app from the full list instead.</p>
<a href="https://umar8092.github.io/apps/">Go back to all apps</a>
</main>
</body>
</html>
